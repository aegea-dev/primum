[package]
name = "primum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Prioritized work items as plain markdown files, with a command line and a local web board"
repository = "https://github.com/erhangundogan/primum"
readme = "README.md"
keywords = ["todo", "kanban", "priority", "markdown", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/templates/**", "/static/**", "/LICENSE", "/README.md"]

[dependencies]
clap = { version = "~4.6.6", features = ["derive"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
toml = { version = "~1.1.6", features = ["preserve_order"] }
axum = "~0.8.9"
tokio = { version = "~1.53.1", features = ["full"] }
askama = "~0.16.0"
chrono = "~0.4.45"
fs2 = "~0.4.3"
regex = "~1.13.1"
anyhow = "~1.0.104"
cel-interpreter = { version = "~0.9.1", features = ["json"] }
sha2 = "~0.11.1"
humantime = "~2.4.0"
rusqlite = { version = "~0.40.2", features = ["bundled"] }
uuid = { version = "~1.28.0", features = ["v7"] }
# native-tls, not the default rustls: its aws-lc-rs is not MIT or Apache-2.0
reqwest = { version = "~0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "http2"] }
wait-timeout = "~0.2.1"
keyring = "~4.2.0"

# Only to restore the default SIGPIPE: `primum list | head` ends quietly.
[target.'cfg(unix)'.dependencies]
libc = "~0.2.190"

[dev-dependencies]
tempfile = "~3.27.0"
tower = { version = "~0.5.3", features = ["util"] }
http-body-util = "~0.1.5"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
